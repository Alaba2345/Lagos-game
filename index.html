<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>Lagos Online</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #rotateMessage {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: none;
            align-items: center;
            justify-content: center;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 20px;
        }

        #rotateMessage div {
            max-width: 300px;
        }

        @media (orientation: portrait) {
            #rotateMessage {
                display: flex;
            }
        }
    </style>
</head>

<body>

<div id="rotateMessage">
    <div>
        📱<br><br>
        <strong>Lagos Online</strong><br><br>
        Rotate your phone sideways to play.
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// ==========================
// WORLD
// ==========================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);


// ==========================
// CAMERA
// ==========================

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        3000
    );

camera.position.set(
    0,
    8,
    14
);

camera.lookAt(
    0,
    2,
    0
);


// ==========================
// GRAPHICS
// ==========================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.5
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);


// ==========================
// LIGHTING
// ==========================

const sunlight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sunlight.position.set(
    50,
    80,
    30
);

scene.add(sunlight);


const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        1
    );

scene.add(
    ambientLight
);


// ==========================
// GROUND
// ==========================

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            500,
            500
        ),
        new THREE.MeshStandardMaterial({
            color: 0x3a7d44
        })
    );

ground.rotation.x =
    -Math.PI / 2;

scene.add(
    ground
);


// ==========================
// TEST BUILDING
// ==========================

const building =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            8,
            8,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0xd19a66
        })
    );

building.position.set(
    0,
    4,
    0
);

scene.add(
    building
);


// ==========================
// GAME LOOP
// ==========================

function gameLoop() {

    requestAnimationFrame(
        gameLoop
    );

    renderer.render(
        scene,
        camera
    );
}

gameLoop();


// ==========================
// SCREEN RESIZE
// ==========================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
