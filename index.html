<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Lagos online</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

// WORLD
const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);


// CAMERA
const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        2000
    );

camera.position.set(0, 5, 10);


// GRAPHICS
const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);


// LIGHT
const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    20,
    30,
    10
);

scene.add(sun);

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1
    );

scene.add(ambient);


// GROUND
const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            500,
            500
        ),
        new THREE.MeshStandardMaterial({
            color: 0x3a7d44
        })
    );

ground.rotation.x =
    -Math.PI / 2;

scene.add(ground);


// FIRST BUILDING
const building =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            8,
            8,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0xd19a66
        })
    );

building.position.y = 4;

scene.add(building);


// CAMERA TARGET
camera.lookAt(
    0,
    2,
    0
);


// GAME LOOP
function gameLoop() {

    requestAnimationFrame(
        gameLoop
    );

    renderer.render(
        scene,
        camera
    );
}

gameLoop();


// RESIZE
window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
